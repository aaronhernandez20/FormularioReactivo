<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Alta de producto</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="theme.toggle()">
        {{ theme.dark ? '☀️ Modo claro' : '🌙 Modo oscuro' }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="productoForm" (ngSubmit)="onSubmit()">
    <ion-list lines="full">

      <ion-item>
        <ion-input
          label="Código de barras (SKU)"
          labelPlacement="floating"
          type="text"
          maxlength="12"
          formControlName="sku"
          errorText="El SKU es obligatorio y debe tener exactamente 12 caracteres alfanuméricos.">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Nombre del producto"
          labelPlacement="floating"
          type="text"
          formControlName="nombre"
          errorText="El nombre del producto es obligatorio.">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-select
          label="Categoría"
          labelPlacement="stacked"
          placeholder="Selecciona una categoría"
          formControlName="categoria"
          errorText="Selecciona una categoría.">
          @for (cat of categorias; track cat) {
            <ion-select-option [value]="cat">{{ cat }}</ion-select-option>
          }
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-input
          label="Stock mínimo"
          labelPlacement="floating"
          type="number"
          inputmode="numeric"
          min="1"
          formControlName="stockMinimo"
          errorText="El stock mínimo es obligatorio y debe ser un número entero mayor que 0.">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Fecha de nacimiento"
          labelPlacement="stacked"
          type="date"
          [max]="hoy"
          formControlName="fechaNacimiento"
          errorText="Introduce una fecha de nacimiento válida (no puede ser posterior a hoy).">
        </ion-input>
      </ion-item>

    </ion-list>

    <div class="ion-padding-top">
      <ion-button
        expand="block"
        type="submit"
        [disabled]="productoForm.invalid || isSubmitting()">
        Guardar producto
      </ion-button>

      @if (ultimoEnvio()) {
        <ion-button
          expand="block"
          fill="outline"
          type="button"
          (click)="descargarPdf()">
          Descargar PDF del último envío
        </ion-button>
      }
    </div>
  </form>

  <ion-loading
    [isOpen]="isSubmitting()"
    message="Guardando producto...">
  </ion-loading>

  <ion-toast
    [isOpen]="toastOpen()"
    [message]="toastMessage()"
    [duration]="3000"
    color="success"
    position="bottom"
    (didDismiss)="toastOpen.set(false)">
  </ion-toast>
</ion-content>
